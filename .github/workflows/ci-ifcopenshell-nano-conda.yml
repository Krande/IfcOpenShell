name: ci-ifcopenshell-nano-ifc-v0.8.0

on:
  push:
    branches:
      - v0.8.0/nano-ifc

jobs:
  activate:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'Krande/IfcOpenShell'
    steps:
      - name: Set env
        run: echo ok go

  test:
    name: ${{ matrix.platform.distver }}-${{ matrix.pyver.name }}
    needs: activate
    runs-on: ${{ matrix.platform.distver }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        pyver: [
          { name: py311, distver: '3.11' }
        ]
        platform: [
          { name: win, distver: windows-latest, pkg_dir: 'win-64' },
          { name: linux, distver: ubuntu-latest, pkg_dir: 'linux-64' },
          { name: macOS, distver: macos-latest, pkg_dir: 'osx-64' }
        ]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Download and extract MacOSX SDK
        if: ${{ matrix.platform.name == 'macOS' }}
        run: |
          curl -L https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.15.sdk.tar.xz | tar -xvJf - -C /Users/runner/work/

      - name: Install ninja
        run: |
          if [[ "$OSTYPE" == "linux-gnu"* ]]; then
            sudo apt-get install ninja-build
          elif [[ "$OSTYPE" == "darwin"* ]]; then
            brew install ninja
          elif [[ "$OSTYPE" == "win32" ]]; then
            choco install ninja
          fi
      - uses: mamba-org/setup-micromamba@v1 # https://github.com/mamba-org/setup-micromamba
        with:
          environment-name: test-env
          condarc: |
            conda-build:
              pkg_format: 2
              zstd_compression_level: 19
            channels:
              - conda-forge
          create-args: >-
            boa
            python=${{ matrix.pyver.distver }}
            anaconda-client

      - name: create conda package dist dir
        run: |
          mkdir -p ${{ github.workspace }}/dist

      - name: build & test ifcopenshell
        run: |
          boa build . --python ${{ matrix.pyver.distver }} --no-remove-work-dir --output-folder '${{ github.workspace }}/dist'
        working-directory: ./src/nano-ifc/conda
