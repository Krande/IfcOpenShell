name: ci-ifcopenshell-conda-daily-v0.8.0

on:
  push:
    branches:
      - v0.8.0/nano-ifc

jobs:
  activate:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'Krande/IfcOpenShell'
    steps:
      - name: Set env
        run: echo ok go

  test:
    name: ${{ matrix.platform.distver }}-${{ matrix.pyver.name }}
    needs: activate
    runs-on: ${{ matrix.platform.distver }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        pyver: [
          { name: py311, distver: '3.11' }
        ]
        platform: [
          { name: win, distver: windows-latest, pkg_dir: 'win-64' },
          { name: linux, distver: ubuntu-latest, pkg_dir: 'linux-64' },
          { name: macOS, distver: macos-latest, pkg_dir: 'osx-64' }
        ]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Download and extract MacOSX SDK
        if: ${{ matrix.platform.name == 'macOS' }}
        run: |
          curl -L https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.13.sdk.tar.xz | tar -xvJf - -C /Users/runner/work/

      - name: try to remove swig
        continue-on-error: true
        run: |
          sudo apt remove swig make
          sudo rm -r /usr/bin/swig4.0

      - uses: mamba-org/setup-micromamba@v1 # https://github.com/mamba-org/setup-micromamba
        with:
          environment-name: test-env
          condarc: |
            conda-build:
              pkg_format: 2
              zstd_compression_level: 19
            channels:
              - conda-forge
          create-args: >-
            boa
            python=${{ matrix.pyver.distver }}
            anaconda-client

      - name: create conda package dist dir
        run: |
          mkdir -p ${{ github.workspace }}/dist

      - name: build & test ifcopenshell
        run: |
          conda config --show-sources
          boa build . --python ${{ matrix.pyver.distver }} --no-remove-work-dir --output-folder '${{ github.workspace }}/dist' --pkg-format=2
        working-directory: ./conda

      - name: upload to anaconda
        run: |
          path="${{ github.workspace }}/dist/*.conda"
          if [ "${{ matrix.platform.name }}" == 'win' ]; then
            path="'$path'"
          fi
          anaconda -t ${{ env.ANACONDA_TOKEN }} upload --force --user krande --label ifc $path